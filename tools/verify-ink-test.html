<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ink test verification</title><link rel="stylesheet" href="../gear/style.css"><script src="../data.js"></script><pre id="report">Running UI checks…</pre><script type="module">
import {openInkTest} from '../gear/ink-test.js';
import {calculate,initialState} from '../gear/core.js';
const catalogue=window.WEAPON_DATA,data=await (await fetch('../gear/data.json')).json();
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const check=(ok,label)=>{if(!ok)throw Error(label);report.textContent+='\nPASS '+label;};
const $=s=>document.querySelector(s),tank=()=>Number($('.test-tank').getAttribute('aria-valuenow'));
const open=weapon=>{const r=calculate({...initialState(),weapon},data,catalogue);openInkTest(r,catalogue.parameters[r.weapon.actor],catalogue.languages.KRko,k=>k);};
const key=(type)=>$('[data-main]').dispatchEvent(new KeyboardEvent(type,{key:' ',bubbles:true,cancelable:true}));
const refill=async()=>{const b=$('[data-refill]');b.focus();b.dispatchEvent(new KeyboardEvent('keydown',{key:' ',bubbles:true,cancelable:true}));await pause(3100);b.dispatchEvent(new KeyboardEvent('keyup',{key:' ',bubbles:true,cancelable:true}));$('[data-main]').focus();};
const close=async()=>{$('#ink-test').close();await pause(30);};
try {
open('Shooter_Normal_00');key('keydown');await pause(350);key('keyup');const n=tank();check(n<98,'held shooter repeats');await pause(150);check(tank()===n,'release stops repeat');
$('[data-sub]').click();check(Math.abs(tank()-(n-70))<1e-8,'sub subtracts ink');const low=tank();$('[data-sub]').click();check(tank()===low,'insufficient ink preserved');const refillButton=$('[data-refill]');refillButton.focus();refillButton.dispatchEvent(new KeyboardEvent('keydown',{key:' ',bubbles:true,cancelable:true}));await pause(600);refillButton.dispatchEvent(new KeyboardEvent('keyup',{key:' ',bubbles:true,cancelable:true}));const partial=tank();check(partial>low+18&&partial<low+25,'refill uses 180-frame swim recovery');await pause(100);check(tank()===partial,'refill stops on release');await refill();check(tank()===100,'held refill');check(!document.querySelector('[data-help]'),'instruction text removed');check(document.querySelector('.test-sub-line').style.bottom==='70%','sub cost line');await close();check(!$('#ink-test'),'close removes dialog');
open('Spinner_Standard_00');check(!document.querySelector('select,progress'),'no dropdown or charge gauge');key('keydown');key('keyup');check(tank()<100&&tank()>80,'first charge fires immediately');check($('[data-mode-count="0"]').value==='1'&&$('[data-mode-count="1"]').value==='0','first charge count isolated');await close();
open('Spinner_Standard_00');document.querySelectorAll('[data-main]')[1].dispatchEvent(new KeyboardEvent('keydown',{key:' ',bubbles:true,cancelable:true}));check(Math.abs(tank()-77.5)<1e-8,'full charge fires immediately');check(Number($('[data-main-count]').value)===1,'spinner first bullet immediate');await pause(130);check(Number($('[data-main-count]').value)>1,'spinner burst continues');check($('[data-mode-count="1"]').value==='1','spinner counts uses not bullets');await close();
open('Stringer_Normal_00');check(document.querySelectorAll('[data-main]').length===3,'three stringer buttons');document.querySelectorAll('[data-main]')[1].click();check(Math.abs(tank()-94)<1e-8,'stringer first charge immediate');check($('[data-mode-count="1"]').value==='1'&&$('[data-mode-count="0"]').value==='0'&&$('[data-mode-count="2"]').value==='0','stringer separate counts');await close();
open('Roller_Normal_00');$('[data-main="0"]').click();$('[data-main="1"]').click();$('[data-main="1"]').click();check($('[data-mode-count="0"]').value==='1'&&$('[data-mode-count="1"]').value==='2','roller horizontal and vertical separate');await close();
open('Charger_Normal_00');check(document.querySelectorAll('[data-main]').length===2,'two charger buttons');document.querySelectorAll('[data-main]')[1].click();check(Math.abs(tank()-82)<1e-8,'charger full charge immediate');check($('[data-mode-count="1"]').value==='1'&&$('[data-mode-count="0"]').value==='0','charger separate counts');await close();
open('Maneuver_Normal_00');const roll=document.querySelectorAll('[data-main]')[1];roll.focus();roll.dispatchEvent(new KeyboardEvent('keydown',{key:' ',bubbles:true,cancelable:true}));check(Math.abs(tank()-93)<1e-8,'roll deducts ink once');check(Number($('[data-main-count]').value)===0,'roll precedes fire');await pause(500);check(Number($('[data-main-count]').value)>0,'held roll transitions to fire');check($('[data-roll-count]').value==='1','roll counts once during fire');roll.dispatchEvent(new KeyboardEvent('keyup',{key:' ',bubbles:true,cancelable:true}));const stopped=tank();await pause(150);check(tank()===stopped,'roll fire stops on release');await close();
open('Maneuver_Normal_00');const shortRoll=document.querySelectorAll('[data-main]')[1];shortRoll.focus();shortRoll.dispatchEvent(new KeyboardEvent('keydown',{key:' ',bubbles:true,cancelable:true}));shortRoll.dispatchEvent(new KeyboardEvent('keyup',{key:' ',bubbles:true,cancelable:true}));await pause(400);check(Math.abs(tank()-93)<1e-8&&Number($('[data-main-count]').value)===0,'early release cancels scheduled fire');await close();
open('Spinner_Downpour_00');$('[data-main="0"]').click();check(Math.abs(tank()-87.22)<1e-8,'ballpoint first charge ink');await pause(1650);check($('[data-main-count]').value==='23'&&$('[data-mode-count="0"]').value==='1','ballpoint first charge 23 bullets one use');await close();
report.textContent+='\nALL UI CHECKS PASSED';
}catch(error){report.textContent+='\nFAIL '+error.message;document.querySelector('dialog')?.close();}
</script></html>
